<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вики-энциклопедия — hoichikov4.org</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#131e32', 950: '#070d19' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .wiki-content h2, #visualEditor h2 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 0.4rem;
            margin-top: 1.5rem;
            margin-bottom: 0.85rem;
        }
        .wiki-content h3, #visualEditor h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .wiki-content p, #visualEditor p {
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 0.9rem;
            font-size: 0.925rem;
        }
        .wiki-content ul, #visualEditor ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
            font-size: 0.925rem;
        }
        .wiki-content li, #visualEditor li {
            margin-bottom: 0.35rem;
        }
        .wiki-link {
            color: #818cf8;
            text-decoration: none;
            border-bottom: 1px dashed rgba(129, 140, 248, 0.5);
            transition: all 0.15s;
        }
        .wiki-link:hover {
            color: #a5b4fc;
            border-bottom-style: solid;
        }
        .wiki-link-red {
            color: #f87171;
            text-decoration: none;
            border-bottom: 1px dashed rgba(248, 113, 113, 0.5);
            cursor: not-allowed;
        }
        #visualEditor:empty:before {
            content: attr(data-placeholder);
            color: #64748b;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Toast Notification (z-[100] всегда поверх модального окна) -->
    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-100px] opacity-0 transition-all duration-300 pointer-events-none bg-indigo-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-indigo-400/30">
        <i id="toastIcon" class="ph ph-check-circle text-xl shrink-0"></i>
        <span id="toastMsg" class="text-sm font-medium">Готово</span>
    </div>

    <!-- Header Navigation -->
    <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex flex-col sm:flex-row items-center justify-between gap-3 py-3">
            <div class="flex items-center gap-3">
                <a href="/" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 hover:opacity-90 transition">
                    <i class="ph ph-book-open-text text-white text-xl"></i>
                </a>
                <div>
                    <h1 class="text-base font-bold text-white leading-tight">Вики-энциклопедия</h1>
                    <p class="text-xs text-slate-400"><a href="/" class="text-indigo-400 hover:underline">hoichikov4.org</a> • Свободный справочник</p>
                </div>
            </div>

            <nav class="flex items-center gap-2 flex-wrap">
                <a href="/" class="px-3.5 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 transition">Главная</a>
                <a href="/parlament" class="px-3.5 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 transition">Парламент</a>
                <a href="/wiki" class="px-3.5 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">Вики</a>
                <a href="/contact" class="px-3.5 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 transition">Связь</a>
            </nav>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- Left Sidebar -->
        <aside class="lg:col-span-3 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3 lg:sticky lg:top-24">
            <!-- Скрыто для всех посетителей до ввода кода 12221 -->
            <div id="adminSidebarControls" class="hidden space-y-2">
                <button type="button" onclick="openEditor(null)" 
                    class="w-full py-2.5 px-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2">
                    <i class="ph ph-plus-circle text-base"></i> Новая статья
                </button>
                <div class="flex items-center justify-between px-2 py-1 bg-indigo-950/50 border border-indigo-800/50 rounded-lg text-[11px] text-indigo-300">
                    <span class="flex items-center gap-1"><i class="ph ph-shield-check"></i> Режим редактора</span>
                    <button type="button" onclick="disableAdminMode()" class="text-slate-400 hover:text-white underline">Выйти</button>
                </div>
            </div>

            <div class="relative">
                <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-sm"></i>
                <input type="text" id="wikiSearch" placeholder="Поиск по статьям..." oninput="handleSearchInput()"
                    class="w-full bg-slate-950 border border-slate-700 text-slate-200 placeholder-slate-500 rounded-xl pl-9 pr-3 py-2 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <button type="button" onclick="openRandomArticle()" 
                class="w-full py-2 px-3 bg-slate-800/80 hover:bg-slate-800 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700/70 transition flex items-center justify-center gap-2">
                <i class="ph ph-shuffle text-indigo-400"></i> Случайная статья
            </button>

            <div class="border-t border-slate-800 pt-3">
                <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-2 mb-2">Статьи по категориям</div>
                <div id="articlesList" class="space-y-3 max-h-[52vh] overflow-y-auto pr-1">
                    <div class="text-xs text-slate-500 px-2 py-4 text-center">Загрузка статей...</div>
                </div>
            </div>
        </aside>

        <!-- Right Main Content -->
        <article class="lg:col-span-9 bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl min-h-[600px]">
            <div class="border-b border-slate-800 pb-4 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                    <div class="flex items-center gap-2 mb-1.5">
                        <span id="artCategory" class="px-2.5 py-0.5 bg-indigo-950 text-indigo-300 border border-indigo-800/80 rounded-md text-[11px] font-semibold">Категория</span>
                        <span class="text-xs text-slate-500">Материал из Вики hoichikov4.org</span>
                    </div>
                    <h1 id="artTitle" class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Загрузка...</h1>
                </div>

                <div class="flex items-center gap-2 self-start sm:self-center">
                    <!-- Скрыто для всех посетителей до ввода кода 12221 -->
                    <div id="adminArticleControls" class="hidden flex items-center gap-2">
                        <button type="button" onclick="openEditor(currentArticleId)" class="px-3 py-1.5 bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                            <i class="ph ph-pencil-simple"></i> Редактировать
                        </button>
                        <button type="button" onclick="deleteArticleDirect(currentArticleId)" class="px-3 py-1.5 bg-red-950/50 hover:bg-red-900/60 border border-red-800/50 text-red-300 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                            <i class="ph ph-trash"></i> Удалить
                        </button>
                    </div>

                    <button type="button" onclick="copyArticleLink()" class="px-3 py-1.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 rounded-lg text-xs flex items-center gap-1.5 transition">
                        <i class="ph ph-link"></i> <span id="copyLinkText">Ссылка</span>
                    </button>
                </div>
            </div>

            <!-- Infobox -->
            <div id="artInfobox" class="hidden lg:float-right lg:w-72 lg:ml-6 mb-6 bg-slate-950 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
                <div id="infoboxHeader" class="bg-indigo-950/90 border-b border-indigo-900/60 px-4 py-2.5 text-center font-bold text-sm text-white"></div>
                <div id="infoboxBanner" class="p-4 flex items-center justify-center bg-slate-900/50 border-b border-slate-800"></div>
                <table class="w-full text-xs">
                    <tbody id="infoboxRows" class="divide-y divide-slate-800/80"></tbody>
                </table>
            </div>

            <!-- Table of Contents -->
            <div id="artToc" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-4 mb-6 inline-block min-w-[240px] max-w-full">
                <div class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <i class="ph ph-list-numbers text-indigo-400"></i> Содержание
                </div>
                <ol id="tocList" class="list-decimal list-inside space-y-1 text-xs text-indigo-400"></ol>
            </div>

            <!-- Article Body -->
            <div id="artBody" class="wiki-content clearfix"></div>

            <!-- Footer -->
            <div class="mt-10 pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-500">
                <div class="flex items-center gap-2">
                    <i class="ph ph-tag text-slate-400"></i>
                    <span>Категория: <strong id="footerCategory" class="text-slate-300"></strong></span>
                </div>
                <div>Вики hoichikov4.org</div>
            </div>
        </article>
    </main>

    <!-- VISUAL EDITOR MODAL -->
    <div id="editorModal" class="hidden fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm overflow-y-auto p-4 sm:p-6">
        <div class="max-w-4xl mx-auto bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden my-4">
            <div class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <i class="ph ph-magic-wand text-indigo-400 text-xl"></i>
                    <h2 id="editorModalTitle" class="text-base font-bold text-white">Визуальный редактор статьи</h2>
                </div>
                <button type="button" onclick="closeEditor()" class="text-slate-400 hover:text-white p-1">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>

            <div class="p-6 space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Название статьи *</label>
                        <input type="text" id="edTitle" oninput="autoSlugify()" placeholder="Например: Кирландия"
                            class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3.5 py-2 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Категория *</label>
                        <input type="text" id="edCategory" placeholder="Государства / Города / История"
                            class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3.5 py-2 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">ID для ссылок (латиница)</label>
                        <input type="text" id="edId" placeholder="kirlandiya"
                            class="w-full bg-slate-950 border border-slate-700 text-indigo-300 font-mono rounded-xl px-3.5 py-2 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Текст статьи (визуальный режим)</label>
                    <div class="border border-slate-700 rounded-xl overflow-hidden bg-slate-950">
                        <div class="bg-slate-850 border-b border-slate-800 p-2 flex flex-wrap items-center gap-1.5">
                            <button type="button" onclick="execFormat('formatBlock', 'H2')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-lg transition">Раздел H2</button>
                            <button type="button" onclick="execFormat('formatBlock', 'H3')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg transition">Подраздел H3</button>
                            <button type="button" onclick="execFormat('formatBlock', 'P')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition">Абзац</button>
                            <div class="w-px h-5 bg-slate-700 mx-1"></div>
                            <button type="button" onclick="execFormat('bold')" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-white text-xs font-black rounded-lg transition">Ж</button>
                            <button type="button" onclick="execFormat('italic')" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-white text-xs italic font-serif rounded-lg transition">К</button>
                            <button type="button" onclick="execFormat('insertUnorderedList')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg transition flex items-center gap-1">
                                <i class="ph ph-list-bullets"></i> Список
                            </button>
                            <div class="w-px h-5 bg-slate-700 mx-1"></div>
                            <button type="button" onclick="insertWikiLinkPrompt()" class="px-2.5 py-1 bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 text-indigo-300 text-xs font-semibold rounded-lg transition flex items-center gap-1">
                                <i class="ph ph-link"></i> Ссылка на статью
                            </button>
                        </div>

                        <div id="visualEditor" contenteditable="true" data-placeholder="Начните писать текст статьи здесь..."
                            class="p-4 min-h-[240px] max-h-[400px] overflow-y-auto outline-none text-sm text-slate-200"></div>
                    </div>
                </div>

                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 text-xs font-bold text-white cursor-pointer">
                            <input type="checkbox" id="edUseInfobox" checked onchange="toggleInfoboxFields()" class="rounded border-slate-700 bg-slate-900 text-indigo-600">
                            Карточка-инфобокс справа
                        </label>
                        <button type="button" onclick="addInfoboxRow('', '')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 text-xs font-semibold rounded-lg transition flex items-center gap-1">
                            <i class="ph ph-plus"></i> Добавить строку
                        </button>
                    </div>

                    <div id="edInfoboxContainer" class="space-y-3 pt-1">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <input type="text" id="edInfoboxHeader" placeholder="Заголовок карточки (например: Республика Данорисия)"
                                class="bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-1.5 text-xs outline-none">
                            <select id="edInfoboxIcon" class="bg-slate-900 border border-slate-700 text-slate-200 rounded-lg px-3 py-1.5 text-xs outline-none">
                                <option value="ph-flag-banner">Иконка: Флаг (Государство)</option>
                                <option value="ph-buildings">Иконка: Здания (Город)</option>
                                <option value="ph-bank">Иконка: Колонны (Парламент / Власть)</option>
                                <option value="ph-shield-chevron">Иконка: Щит (Армия / Организация)</option>
                                <option value="ph-book-bookmark">Иконка: Книга (История / Закон)</option>
                                <option value="ph-user-circle">Иконка: Персона</option>
                            </select>
                        </div>
                        <div id="edInfoboxRows" class="space-y-2"></div>
                    </div>
                </div>

                <!-- Блок отображения ошибок прямо внутри окна редактора -->
                <div id="editorErrorBox" class="hidden p-3.5 bg-red-950/90 border border-red-500/60 rounded-xl text-xs text-red-200 flex items-center gap-2.5">
                    <i class="ph ph-warning-circle text-lg text-red-400 shrink-0"></i>
                    <span id="editorErrorText"></span>
                </div>
            </div>

            <div class="bg-slate-950 border-t border-slate-800 px-6 py-4 flex items-center justify-between">
                <button type="button" id="btnDeleteArticleModal" onclick="deleteArticleDirect(editingArticleId)" class="px-3.5 py-2 bg-red-950/60 hover:bg-red-900/60 text-red-300 border border-red-800/60 text-xs font-semibold rounded-xl transition">
                    Удалить статью
                </button>
                <div class="flex items-center gap-2 ml-auto">
                    <button type="button" onclick="closeEditor()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition">Отмена</button>
                    <button type="button" id="btnSaveArticle" onclick="saveVisualArticle()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition">
                        Опубликовать для всех
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // НАСТРОЙКА SUPABASE
        // Замените текст внутри кавычек на ваш Publishable key (sb_publishable_...)
        // =========================================================================
        const SUPABASE_URL = 'https://fqormwsoyczshuoeafxo.supabase.co';
        const SUPABASE_KEY = 'ВСТАВЬТЕ_СЮДА_СКОПИРОВАННЫЙ_PUBLISHABLE_КЛЮЧ';

        // Резервные статьи (показываются только если ключ ещё не вставлен)
        const fallbackArticles = {
            "danorisiya": {
                title: "Данорисия",
                category: "Государства",
                infobox: {
                    header: "Республика Данорисия",
                    icon: "ph-flag-banner",
                    rows: [
                        ["Столица", "[[goidagrad|Гойдаград]]"],
                        ["Форма правления", "Парламентская республика"],
                        ["Законодательный орган", "[[assembly|Народное Собрание]] (5000 мест)"]
                    ]
                },
                content: "<p><b>Данорисия</b> — государство с уникальной представительной системой власти. Столицей является город [[goidagrad|Гойдаград]].</p>"
            }
        };

        let wikiArticles = {};
        let currentArticleId = null;
        let editingArticleId = null;
        let adminSecretCode = sessionStorage.getItem('hoichikov4_admin_code') || '';
        let toastTimer = null;

        document.execCommand('defaultParagraphSeparator', false, 'p');

        function isSupabaseConfigured() {
            return SUPABASE_URL.startsWith('http') &&
                   (SUPABASE_KEY.startsWith('sb_publishable_') || SUPABASE_KEY.startsWith('eyJ'));
        }

        function getSupabaseHeaders(withJson = false) {
            const headers = {
                'apikey': SUPABASE_KEY
            };
            if (SUPABASE_KEY.startsWith('eyJ')) {
                headers['Authorization'] = `Bearer ${SUPABASE_KEY}`;
            }
            if (withJson) {
                headers['Content-Type'] = 'application/json';
            }
            return headers;
        }

        function showEditorError(msg) {
            const box = document.getElementById('editorErrorBox');
            const text = document.getElementById('editorErrorText');
            if (!msg) {
                box.classList.add('hidden');
                return;
            }
            text.textContent = msg;
            box.classList.remove('hidden');
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            toast.className = `fixed top-5 right-5 z-[100] transition-all duration-300 pointer-events-none px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border text-white ${isError ? 'bg-red-600 border-red-400/40' : 'bg-indigo-600 border-indigo-400/40'}`;
            icon.className = isError ? 'ph ph-warning-circle text-xl shrink-0' : 'ph ph-check-circle text-xl shrink-0';
            document.getElementById('toastMsg').textContent = msg;
            
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 3800);
        }

        function enableAdminMode(code, silent = false) {
            adminSecretCode = code;
            sessionStorage.setItem('hoichikov4_admin_code', code);
            document.getElementById('adminSidebarControls').classList.remove('hidden');
            document.getElementById('adminArticleControls').classList.remove('hidden');
            if (!silent) showToast('Режим редактора открыт');
        }

        function disableAdminMode() {
            adminSecretCode = '';
            sessionStorage.removeItem('hoichikov4_admin_code');
            document.getElementById('adminSidebarControls').classList.add('hidden');
            document.getElementById('adminArticleControls').classList.add('hidden');
            showToast('Режим редактора закрыт');
        }

        function handleSearchInput() {
            const input = document.getElementById('wikiSearch');
            const val = input.value.trim();
            if (val === '12221') {
                input.value = '';
                enableAdminMode('12221', false);
            }
            renderSidebar();
        }

        // =========================================================================
        // РАБОТА С ОБЛАЧНОЙ БАЗОЙ SUPABASE
        // =========================================================================
        async function loadArticlesFromCloud() {
            if (!isSupabaseConfigured()) {
                wikiArticles = JSON.parse(JSON.stringify(fallbackArticles));
                return;
            }

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/wiki_articles?select=*&order=created_at.asc`, {
                    headers: getSupabaseHeaders(false)
                });
                if (!res.ok) throw new Error(`Ошибка базы (${res.status})`);
                const rows = await res.json();
                const map = {};
                rows.forEach(row => {
                    map[row.id] = {
                        title: row.title,
                        category: row.category,
                        infobox: row.infobox,
                        content: row.content
                    };
                });
                wikiArticles = Object.keys(map).length > 0 ? map : JSON.parse(JSON.stringify(fallbackArticles));
            } catch (e) {
                console.error(e);
                wikiArticles = JSON.parse(JSON.stringify(fallbackArticles));
                showToast('Не удалось загрузить статьи из Supabase', true);
            }
        }

        async function saveArticleToCloud(id, articleObj) {
            if (!isSupabaseConfigured()) {
                throw new Error('Ключ Supabase не прописан в коде файла (строка SUPABASE_KEY)');
            }

            const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/save_wiki_article`, {
                method: 'POST',
                headers: getSupabaseHeaders(true),
                body: JSON.stringify({
                    p_code: adminSecretCode,
                    p_id: id,
                    p_title: articleObj.title,
                    p_category: articleObj.category,
                    p_infobox: articleObj.infobox,
                    p_content: articleObj.content
                })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Ошибка сохранения (${res.status})`);
            }
            return true;
        }

        async function deleteArticleFromCloud(id) {
            if (!isSupabaseConfigured()) {
                throw new Error('Ключ Supabase не прописан в коде файла (строка SUPABASE_KEY)');
            }

            const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/delete_wiki_article`, {
                method: 'POST',
                headers: getSupabaseHeaders(true),
                body: JSON.stringify({
                    p_code: adminSecretCode,
                    p_id: id
                })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Ошибка удаления (${res.status})`);
            }
            return true;
        }

        // =========================================================================
        // ОТРИСОВКА ИНТЕРФЕЙСА И РЕДАКТОРА
        // =========================================================================
        function parseWikiLinks(htmlString) {
            return htmlString.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (match, targetId, label) => {
                const cleanId = targetId.trim();
                const article = wikiArticles[cleanId];
                const displayText = label ? label.trim() : (article ? article.title : cleanId);
                if (article) {
                    return `<a href="#${cleanId}" onclick="openArticle('${cleanId}'); return false;" class="wiki-link">${displayText}</a>`;
                } else {
                    return `<span class="wiki-link-red" title="Статья «${cleanId}» ещё не создана">${displayText}</span>`;
                }
            });
        }

        function renderSidebar() {
            const query = document.getElementById('wikiSearch').value.toLowerCase().trim();
            const container = document.getElementById('articlesList');
            const categories = {};

            Object.entries(wikiArticles).forEach(([id, art]) => {
                if (query && !art.title.toLowerCase().includes(query) && !art.content.toLowerCase().includes(query)) return;
                const cat = art.category || "Общее";
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push({ id, ...art });
            });

            if (Object.keys(categories).length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-500 px-2 py-4 text-center">Ничего не найдено</div>`;
                return;
            }

            container.innerHTML = Object.entries(categories).map(([catName, items]) => `
                <div>
                    <div class="text-[11px] font-semibold text-slate-400 px-2 mb-1 flex items-center justify-between">
                        <span>${catName}</span>
                        <span class="text-[10px] text-slate-600 font-mono">${items.length}</span>
                    </div>
                    <div class="space-y-0.5">
                        ${items.map(item => {
                            const isActive = item.id === currentArticleId;
                            return `
                                <a href="#${item.id}" onclick="openArticle('${item.id}'); return false;"
                                   class="block px-2.5 py-1.5 rounded-lg text-xs transition truncate ${isActive ? 'bg-indigo-600/20 text-indigo-300 font-semibold border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-800/70'}">
                                    ${item.title}
                                </a>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openArticle(id) {
            const keys = Object.keys(wikiArticles);
            if (keys.length === 0) return;
            const targetId = wikiArticles[id] ? id : keys[0];
            const art = wikiArticles[targetId];

            currentArticleId = targetId;
            window.history.replaceState(null, '', '#' + targetId);
            document.title = `${art.title} — Вики hoichikov4.org`;

            document.getElementById('artTitle').textContent = art.title;
            document.getElementById('artCategory').textContent = art.category || "Общее";
            document.getElementById('footerCategory').textContent = art.category || "Общее";

            const infoboxEl = document.getElementById('artInfobox');
            if (art.infobox && art.infobox.rows && art.infobox.rows.length > 0) {
                infoboxEl.classList.remove('hidden');
                document.getElementById('infoboxHeader').textContent = art.infobox.header || art.title;
                document.getElementById('infoboxBanner').innerHTML = `
                    <div class="w-16 h-16 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-center shadow-inner">
                        <i class="ph ${art.infobox.icon || 'ph-article'} text-3xl text-indigo-400"></i>
                    </div>
                `;
                document.getElementById('infoboxRows').innerHTML = art.infobox.rows.map(([k, v]) => `
                    <tr>
                        <td class="px-3 py-2 font-semibold text-slate-400 bg-slate-900/40 w-2/5 align-top">${k}</td>
                        <td class="px-3 py-2 text-slate-200 align-top">${parseWikiLinks(v)}</td>
                    </tr>
                `).join('');
            } else {
                infoboxEl.classList.add('hidden');
            }

            const bodyEl = document.getElementById('artBody');
            bodyEl.innerHTML = parseWikiLinks(art.content);

            const headings = bodyEl.querySelectorAll('h2');
            const tocEl = document.getElementById('artToc');
            const tocList = document.getElementById('tocList');
            if (headings.length > 0) {
                tocEl.classList.remove('hidden');
                tocList.innerHTML = Array.from(headings).map((h, idx) => {
                    const anchor = `sec-${idx}`;
                    h.id = anchor;
                    return `<li><a href="#${anchor}" onclick="document.getElementById('${anchor}').scrollIntoView({behavior:'smooth'}); return false;" class="hover:underline">${h.textContent}</a></li>`;
                }).join('');
            } else {
                tocEl.classList.add('hidden');
            }

            renderSidebar();
        }

        function openRandomArticle() {
            const keys = Object.keys(wikiArticles);
            if (keys.length <= 1) return;
            let nextKey = currentArticleId;
            while (nextKey === currentArticleId) {
                nextKey = keys[Math.floor(Math.random() * keys.length)];
            }
            openArticle(nextKey);
        }

        function copyArticleLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btnText = document.getElementById('copyLinkText');
                btnText.textContent = "Скопировано!";
                setTimeout(() => btnText.textContent = "Ссылка", 2000);
            });
        }

        function transliterateSlug(text) {
            const map = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
            return text.toLowerCase().split('').map(c => map[c] !== undefined ? map[c] : c).join('').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
        }

        function autoSlugify() {
            if (editingArticleId !== null) return;
            document.getElementById('edId').value = transliterateSlug(document.getElementById('edTitle').value);
        }

        function execFormat(cmd, val = null) {
            document.getElementById('visualEditor').focus();
            document.execCommand(cmd, false, val);
        }

        function insertWikiLinkPrompt() {
            const existingList = Object.entries(wikiArticles).map(([id, a]) => `${id} (${a.title})`).join(', ');
            const targetId = prompt(`Введите ID статьи для ссылки:\nДоступные: ${existingList}`);
            if (!targetId) return;
            const cleanId = targetId.trim();
            const defaultLabel = wikiArticles[cleanId] ? wikiArticles[cleanId].title : cleanId;
            const label = prompt('Текст ссылки в статье:', defaultLabel) || defaultLabel;

            document.getElementById('visualEditor').focus();
            document.execCommand('insertText', false, `[[${cleanId}|${label}]]`);
        }

        document.getElementById('visualEditor').addEventListener('paste', function(e) {
            e.preventDefault();
            const text = (e.originalEvent || e).clipboardData.getData('text/plain');
            document.execCommand('insertText', false, text);
        });

        function toggleInfoboxFields() {
            const enabled = document.getElementById('edUseInfobox').checked;
            document.getElementById('edInfoboxContainer').classList.toggle('hidden', !enabled);
        }

        function addInfoboxRow(key = '', val = '') {
            const container = document.getElementById('edInfoboxRows');
            const row = document.createElement('div');
            row.className = 'grid grid-cols-12 gap-2 items-center infobox-edit-row';
            row.innerHTML = `
                <input type="text" value="${key.replace(/"/g, '&quot;')}" placeholder="Поле (Столица)" class="col-span-5 bg-slate-900 border border-slate-700 text-slate-200 rounded-lg px-2.5 py-1.5 text-xs outline-none row-key">
                <input type="text" value="${val.replace(/"/g, '&quot;')}" placeholder="Значение ([[goidagrad|Гойдаград]])" class="col-span-6 bg-slate-900 border border-slate-700 text-slate-200 rounded-lg px-2.5 py-1.5 text-xs outline-none row-val">
                <button type="button" onclick="this.parentElement.remove()" class="col-span-1 text-slate-500 hover:text-red-400 flex justify-center"><i class="ph ph-trash text-base"></i></button>
            `;
            container.appendChild(row);
        }

        function openEditor(id) {
            if (!adminSecretCode) return;
            editingArticleId = id;
            showEditorError('');
            const modal = document.getElementById('editorModal');
            const rowsContainer = document.getElementById('edInfoboxRows');
            rowsContainer.innerHTML = '';

            if (id && wikiArticles[id]) {
                const art = wikiArticles[id];
                document.getElementById('editorModalTitle').textContent = `Редактирование: ${art.title}`;
                document.getElementById('edTitle').value = art.title;
                document.getElementById('edCategory').value = art.category || '';
                document.getElementById('edId').value = id;
                document.getElementById('edId').disabled = true;
                document.getElementById('visualEditor').innerHTML = art.content;
                document.getElementById('btnDeleteArticleModal').classList.remove('hidden');

                if (art.infobox && art.infobox.rows && art.infobox.rows.length > 0) {
                    document.getElementById('edUseInfobox').checked = true;
                    document.getElementById('edInfoboxHeader').value = art.infobox.header || art.title;
                    document.getElementById('edInfoboxIcon').value = art.infobox.icon || 'ph-flag-banner';
                    art.infobox.rows.forEach(([k, v]) => addInfoboxRow(k, v));
                } else {
                    document.getElementById('edUseInfobox').checked = false;
                }
            } else {
                document.getElementById('editorModalTitle').textContent = 'Новая статья';
                document.getElementById('edTitle').value = '';
                document.getElementById('edCategory').value = 'Государства';
                document.getElementById('edId').value = '';
                document.getElementById('edId').disabled = false;
                document.getElementById('visualEditor').innerHTML = '<p>Начните вводить текст статьи...</p>';
                document.getElementById('btnDeleteArticleModal').classList.add('hidden');
                document.getElementById('edUseInfobox').checked = true;
                document.getElementById('edInfoboxHeader').value = '';
                addInfoboxRow('Столица', '');
                addInfoboxRow('Население', '');
            }

            toggleInfoboxFields();
            modal.classList.remove('hidden');
        }

        function closeEditor() {
            showEditorError('');
            document.getElementById('editorModal').classList.add('hidden');
        }

        async function saveVisualArticle() {
            showEditorError('');
            const title = document.getElementById('edTitle').value.trim();
            const category = document.getElementById('edCategory').value.trim() || 'Общее';
            const id = document.getElementById('edId').value.trim() || transliterateSlug(title);
            const content = document.getElementById('visualEditor').innerHTML.trim();

            if (!title || !id) {
                showEditorError('Укажите название статьи');
                return;
            }

            let infobox = null;
            if (document.getElementById('edUseInfobox').checked) {
                const rows = [];
                document.querySelectorAll('.infobox-edit-row').forEach(rowEl => {
                    const k = rowEl.querySelector('.row-key').value.trim();
                    const v = rowEl.querySelector('.row-val').value.trim();
                    if (k && v) rows.push([k, v]);
                });
                if (rows.length > 0) {
                    infobox = {
                        header: document.getElementById('edInfoboxHeader').value.trim() || title,
                        icon: document.getElementById('edInfoboxIcon').value,
                        rows: rows
                    };
                }
            }

            const btn = document.getElementById('btnSaveArticle');
            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Сохранение...';

            try {
                const articleData = { title, category, infobox, content };
                const ok = await saveArticleToCloud(id, articleData);
                if (ok) {
                    wikiArticles[id] = articleData;
                    closeEditor();
                    openArticle(id);
                    showToast('Статья опубликована и видна всем посетителям!');
                }
            } catch (err) {
                showEditorError(err.message);
                showToast(err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = origText;
            }
        }

        async function deleteArticleDirect(id) {
            if (!adminSecretCode || !id) return;
            if (Object.keys(wikiArticles).length <= 1) {
                showEditorError('Нельзя удалить последнюю статью');
                showToast('Нельзя удалить последнюю статью', true);
                return;
            }
            if (!confirm(`Удалить статью «${wikiArticles[id].title}» для всех посетителей?`)) return;

            try {
                const ok = await deleteArticleFromCloud(id);
                if (ok) {
                    delete wikiArticles[id];
                    closeEditor();
                    openArticle(Object.keys(wikiArticles)[0]);
                    showToast('Статья удалена для всех!');
                }
            } catch (err) {
                showEditorError(err.message);
                showToast(err.message, true);
            }
        }

        window.onload = async function() {
            if (adminSecretCode === '12221') {
                enableAdminMode('12221', true);
            }
            await loadArticlesFromCloud();
            const hashId = window.location.hash.replace('#', '').trim();
            openArticle(hashId && wikiArticles[hashId] ? hashId : Object.keys(wikiArticles)[0]);
        };
    </script>
